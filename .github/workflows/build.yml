name: WEB2APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check environment
        run: |
          echo "WEB2APK Worker siap dijalankan."
          java -version

      - name: Build status
        run: echo "Environment berhasil disiapkan."
